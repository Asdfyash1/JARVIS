server:
  host: "127.0.0.1"
  port: 8765
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

audio:
  sample_rate: 16000
  channels: 1
  frame_ms: 30
  silence_timeout_ms: 1000
  pre_speech_ms: 300
  input_device: null
  output_device: null

vad:
  engine: "silero"
  threshold: 0.55
  min_speech_ms: 180

stt:
  # VoxCPM is a TTS/voice-generation model; Faster-Whisper remains the STT engine.
  engine: "faster_whisper"
  model_size: "small.en"
  device: "auto"
  compute_type: "auto"
  beam_size: 1
  language: "en"

tts:
  engine: "voxcpm"
  piper_binary: "piper"
  voice_model: "./voices/en_US-lessac-medium.onnx"
  speaker_id: null
  voxcpm_model: "openbmb/VoxCPM2"
  voxcpm_local_dir: null
  voxcpm_load_denoiser: false
  voxcpm_cfg_value: 2.0
  voxcpm_inference_timesteps: 10
  voice_profile: "female_thick"
  voice_profiles:
    female_thick: "A confident adult woman with a deeper, thicker, warm contralto voice, calm Jarvis assistant tone, clear articulation, cinematic presence"
    male_thick: "A confident adult man with a deep, thick, warm baritone voice, calm Jarvis assistant tone, clear articulation, cinematic presence"

llm:
  provider: "nvidia"
  base_url: "https://integrate.api.nvidia.com/v1"
  model: "meta/llama-3.1-8b-instruct"
  api_key_env: "NVIDIA_API_KEY"
  openai_base_url: "https://api.openai.com/v1"
  openai_model: "gpt-4o-mini"
  openai_api_key_env: "OPENAI_API_KEY"
  gemini_base_url: "https://generativelanguage.googleapis.com/v1beta"
  gemini_model: "gemini-1.5-flash"
  gemini_api_key_env: "GEMINI_API_KEY"
  temperature: 0.3
  max_tokens: 1024
  streaming: false
  system_prompt: |
    You are Jarvis, a real-time voice assistant.
    Reply conversationally for normal questions.
    For actions, respond only as valid JSON with "spoken_response" and "actions".
    Supported actions: open_app, close_app, focus_window, open_website, google_search, youtube_control, whatsapp_message, system_command.
    For web search requests use {"action":"google_search","query":"..."}.
    For WhatsApp contacts prepare {"action":"whatsapp_message","contact":"...","message":"..."}.
    For unknown WhatsApp phone numbers prepare {"action":"whatsapp_message","phone_number":"+15551234567","message":"..."}.
    If the user already opened a WhatsApp chat and asks to send a message there, prepare {"action":"whatsapp_message","message":"..."} without contact or phone_number.
    Never claim an action was executed; the backend asks confirmation and executes it.

memory:
  sqlite_path: "./data/jarvis.sqlite3"
  max_history_messages: 24

actions:
  require_confirmation: true
  linux_app_allowlist:
    chrome: "google-chrome"
    edge: "microsoft-edge"
    vscode: "code"
    terminal: "gnome-terminal"
  browser_debugger_address: "127.0.0.1:9222"
  edge_debugger_address: "127.0.0.1:9223"
  browser_debugger_addresses:
    - "127.0.0.1:9222"
    - "127.0.0.1:9223"
  command_allowlist:
    - "xdg-open"
    - "wmctrl"
    - "xdotool"
